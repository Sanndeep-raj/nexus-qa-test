name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom release tag name (e.g. v1.2.3)'
        required: true
        type: string

      release_name:
        description: 'Release display name (e.g. "Hotfix for login bug")'
        required: true
        type: string

      working_directory:
        description: 'Working directory (leave empty for repository root)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_NAME: ${{ inputs.release_name }}
      WORKING_DIRECTORY: ${{ inputs.working_directory || '.' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag name
        run: |
          TAG="${{ env.TAG_NAME }}"

          git check-ref-format "refs/tags/$TAG"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag '$TAG' already exists."
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install
        run: bun install
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Build
        run: bun run build
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Zip build
        run: |
          cd .prebuild
          zip -r ../build-output.zip .
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: ${{ env.WORKING_DIRECTORY }}/build-output.zip